name: Git Sync Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get commit info
        id: commit
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "🔔 Git Push 알림" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "📝 ${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
          echo "👤 ${{ github.event.head_commit.author.name }}" >> $GITHUB_OUTPUT
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "모든 에이전트: git pull 하세요!" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: ${{ steps.commit.outputs.message }}
